<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANALYSE FONDAMENTALE + TECHNIQUE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-color: #131722;
            --card-bg: #1e222d;
            --text-main: #d1d4dc;
            --text-muted: #787b86;
            --green: #089981;
            --red: #f23645;
            --orange: #ffb700;
            --border: #2a2e39;
            --accent: #2962ff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        /* Chart Section */
        #chart-container {
            width: 100%;
            height: 400px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 30px;
            overflow: hidden;
            position: relative;
        }

        #chart-label {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            font-weight: bold;
            font-size: 1.2rem;
            background: rgba(19, 23, 34, 0.7);
            padding: 5px 10px;
            border-radius: 4px;
        }

        /* Search & Controls */
        .search-box {
            display: flex;
            gap: 10px;
            background: var(--card-bg);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        input {
            background: transparent;
            border: none;
            color: #fff;
            padding: 8px;
            width: 300px;
            outline: none;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }

        .ticker-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 20px;
            cursor: pointer;
            transition: border 0.3s;
        }

        .ticker-card:hover { border-color: var(--accent); }
        .ticker-card.active { border: 2px solid var(--accent); }

        .card-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .ratio-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .ratio-item {
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .ratio-label { font-size: 0.65rem; color: var(--text-muted); display: block; margin-bottom: 4px; }
        .ratio-value { font-weight: bold; font-size: 0.9rem; }

        .v-green { color: var(--green); }
        .v-orange { color: var(--orange); }
        .v-red { color: var(--red); }

        .verdict-tag {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ANALYSE BOURSIÈRE PRO</h1>
        <div class="search-box">
            <input type="text" id="tickerInput" value="NVDA, AAPL, MSFT, TSLA, GOOG">
            <button onclick="startAnalysis()">ANALYSÉ</button>
        </div>
    </header>

    <div id="chart-container">
        <div id="chart-label">Sélectionnez une action</div>
        <div id="tv-chart"></div>
    </div>

    <div id="resultsContainer" class="dashboard-grid">
        </div>
</div>

<script>
    const API_KEY = "VOTRE_CLE_API_ICI"; // REMPLACEZ PAR VOTRE CLÉ FMP
    let chart;
    let lineSeries;

    // Initialisation du graphique TradingView
    function initChart() {
        const chartElement = document.getElementById('tv-chart');
        chart = LightweightCharts.createChart(chartElement, {
            width: chartElement.offsetWidth,
            height: 400,
            layout: { backgroundColor: '#1e222d', textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            priceScale: { borderColor: '#2a2e39' },
            timeScale: { borderColor: '#2a2e39' },
        });
        lineSeries = chart.addLineSeries({
            color: '#2962ff',
            lineWidth: 2,
        });

        window.addEventListener('resize', () => {
            chart.applyOptions({ width: chartElement.offsetWidth });
        });
    }

    async function updateChart(symbol) {
        document.getElementById('chart-label').innerText = `${symbol} - Historique 1 an`;
        const data = await fetch(`https://financialmodelingprep.com/api/v3/historical-price-full/${symbol}?timeseries=365&apikey=${API_KEY}`).then(res => res.json());
        
        if (data.historical) {
            const chartData = data.historical.reverse().map(item => ({
                time: item.date,
                value: item.close
            }));
            lineSeries.setData(chartData);
            chart.timeScale().fitContent();
        }
    }

    const CRITERIA = {
        pe: { label: "P/E", check: (v) => v <= 16 ? 'v-green' : v <= 20 ? 'v-orange' : 'v-red' },
        roe: { label: "ROE %", check: (v) => v >= 15 ? 'v-green' : v >= 10 ? 'v-orange' : 'v-red' },
        debtEquity: { label: "D/E Ratio", check: (v) => v <= 0.5 ? 'v-green' : v <= 1 ? 'v-orange' : 'v-red' },
        netMargin: { label: "Marge %", check: (v) => v >= 10 ? 'v-green' : v >= 5 ? 'v-orange' : 'v-red' },
        revenueGrowth: { label: "Croiss. CA", check: (v) => v >= 10 ? 'v-green' : v >= 5 ? 'v-orange' : 'v-red' },
        fcfYield: { label: "FCF Yield", check: (v) => v >= 8 ? 'v-green' : v >= 4 ? 'v-orange' : 'v-red' }
    };

    async function startAnalysis() {
        const tickers = document.getElementById('tickerInput').value.split(',').map(t => t.trim().toUpperCase());
        const container = document.getElementById('resultsContainer');
        container.innerHTML = '';

        for (const symbol of tickers) {
            const [profile, ratios, growth] = await Promise.all([
                fetch(`https://financialmodelingprep.com/api/v3/profile/${symbol}?apikey=${API_KEY}`).then(r => r.json()),
                fetch(`https://financialmodelingprep.com/api/v3/ratios/${symbol}?apikey=${API_KEY}`).then(r => r.json()),
                fetch(`https://financialmodelingprep.com/api/v3/financial-growth/${symbol}?apikey=${API_KEY}`).then(r => r.json())
            ]);

            if (profile && profile[0]) {
                const r = ratios[0];
                const g = growth[0];
                const values = {
                    pe: r.priceEarningsRatio,
                    roe: r.returnOnEquity * 100,
                    debtEquity: r.debtEquityRatio,
                    netMargin: r.netProfitMargin * 100,
                    revenueGrowth: g.revenueGrowth * 100,
                    fcfYield: (r.freeCashFlowPerShare / profile[0].price) * 100
                };

                renderCard(symbol, profile[0], values);
            }
        }
    }

    function renderCard(symbol, profile, values) {
        const container = document.getElementById('resultsContainer');
        const card = document.createElement('div');
        card.className = 'ticker-card';
        card.onclick = () => {
            document.querySelectorAll('.ticker-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            updateChart(symbol);
        };

        let ratioHtml = '';
        let redCount = 0;

        for (const [key, val] of Object.entries(values)) {
            const cls = CRITERIA[key].check(val);
            if (cls === 'v-red') redCount++;
            ratioHtml += `
                <div class="ratio-item">
                    <span class="ratio-label">${CRITERIA[key].label}</span>
                    <span class="ratio-value ${cls}">${val ? val.toFixed(1) : 'N/A'}</span>
                </div>
            `;
        }

        const verdict = redCount >= 2 ? "PRUDENCE" : "ACHAT POTENTIEL";
        const verdictCls = redCount >= 2 ? 'v-red' : 'v-green';

        card.innerHTML = `
            <div class="card-header">
                <div>
                    <strong style="font-size:1.2rem; color:#fff">${symbol}</strong><br>
                    <small style="color:var(--text-muted)">${profile.industry}</small>
                </div>
                <div style="text-align:right">
                    <span style="font-size:1.1rem; font-weight:bold">$${profile.price}</span><br>
                    <small class="${profile.changes >= 0 ? 'v-green' : 'v-red'}">${profile.changes > 0 ? '+' : ''}${profile.changes}%</small>
                </div>
            </div>
            <div class="ratio-grid">${ratioHtml}</div>
            <div class="verdict-tag" style="background: rgba(0,0,0,0.3); border: 1px solid ${redCount >= 2 ? 'var(--red)' : 'var(--green)'}">
                <span class="${verdictCls}">${verdict}</span>
            </div>
        `;
        container.appendChild(card);
    }

    // Lancer au démarrage
    initChart();
    startAnalysis();
</script>
</body>
</html>
